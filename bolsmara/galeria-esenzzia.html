<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Essens | Bolsmara</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

    <title>Bolsmara</title>
    
    <!-- Aquí enlazas tu archivo CSS -->
    <link rel="stylesheet" href="estilos.css">
</head> 

<body>
<header class="barra-superior">
        <div class="header-contenido">
            <div class="logotipo-bloque">
                <img src="bolsmara.png" alt="Logo" class="logo-img">
                <span class="nombre-empresa">Bolsmara</span>
            </div>
            <nav class="menu-enlaces">
                <a href="index.html">Inicio</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <section class="seccion-blanca animacion-subir">
            <h2>Colección: Essens</h2>
            <p>Diseños exclusivos con acabados premium y colores corporativos de alta fidelidad.</p>
            
<!-- ... este bloque va dentro del <main class="contenedor"> de cada archivo ... -->
        <section class="seccion-blanca animacion-subir">
            <h2>Catálogo de Productos</h2>
            <p>Pasa el mouse sobre las imágenes para ampliarlas.</p>
            
            <!-- CUADRÍCULA DE 15 FOTOS (MATRIZ 5x3 EN PC) -->
            <div class="matriz-fotos">
                <img src="essensmano.png" alt="Producto 1" class="foto-matriz">
                <img src="essenssolo.png" alt="Producto 2" class="foto-matriz">
                <img src="foto3.png" alt="Producto 3" class="foto-matriz">
                <img src="foto4.png" alt="Producto 4" class="foto-matriz">
                <img src="foto5.png" alt="Producto 5" class="foto-matriz">
                
                <img src="foto6.png" alt="Producto 6" class="foto-matriz">
                <img src="foto7.png" alt="Producto 7" class="foto-matriz">
                <img src="foto8.png" alt="Producto 8" class="foto-matriz">
                <img src="foto9.png" alt="Producto 9" class="foto-matriz">
                <img src="foto10.png" alt="Producto 10" class="foto-matriz">
                
                <img src="foto11.png" alt="Producto 11" class="foto-matriz">
                <img src="foto12.png" alt="Producto 12" class="foto-matriz">
                <img src="foto13.png" alt="Producto 13" class="foto-matriz">
                <img src="foto14.png" alt="Producto 14" class="foto-matriz">
                <img src="foto15.png" alt="Producto 15" class="foto-matriz">
            </div>
        </section>
    </main>
</body>
</html>
